<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beach Adventure Game with Teacher Wafi</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #FF6B6B;
      --primary-dark: #EE5253;
      --secondary: #48DBFB;
      --accent: #FF9F43;
      --green: #1DD1A1;
      --yellow: #FECA57;
      --dark: #222F3E;
      --card-bg: rgba(255, 255, 255, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(180deg, #70A1FF 0%, #A0E7E5 50%, #FFEAA7 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--dark);
      overflow-x: hidden;
      padding-bottom: 25px;
    }

    header {
      width: 100%;
      background: linear-gradient(135deg, #FF6B6B, #FF9F43);
      color: white;
      text-align: center;
      padding: 14px 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      position: relative;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 1.8rem;
      text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
      letter-spacing: 1px;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 15px 10px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 850px;
    }

    .tab-btn {
      font-family: 'Fredoka One', cursive;
      background: var(--card-bg);
      border: 3px solid white;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 1rem;
      color: var(--dark);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn.active {
      background: var(--accent);
      color: white;
      transform: scale(1.05);
      border-color: var(--yellow);
    }

    .container {
      width: 95%;
      max-width: 850px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      border: 4px solid white;
      margin-bottom: 20px;
    }

    /* Hijab Teacher Wafi Avatar Section */
    .teacher-box {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #FFF0F6;
      border-radius: 20px;
      padding: 14px 18px;
      border: 3px solid #FF85C0;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.15);
    }

    .teacher-avatar {
      width: 68px;
      height: 68px;
      background: #FF85C0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3rem;
      border: 3px solid white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .teacher-speech {
      font-size: 1.05rem;
      font-weight: 700;
      color: #D32F2F;
      line-height: 1.4;
    }

    /* Module Screens */
    .game-screen {
      display: none;
    }

    .game-screen.active {
      display: block;
    }

    /* Unscramble & Verb Game */
    .word-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 6px 15px rgba(0,0,0,0.05);
      margin-bottom: 15px;
    }

    .word-icon {
      font-size: 4.5rem;
      margin-bottom: 10px;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Tile-Based Unscramble Slots & Bank */
    .slots-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 15px 0;
      min-height: 55px;
      padding: 8px;
      background: #F1F2F6;
      border-radius: 16px;
      border: 2px dashed #CED6E0;
    }

    .slot-tile {
      width: 44px;
      height: 48px;
      border-radius: 12px;
      border: 2px solid #54A0FF;
      background: #E8F4FE;
      color: #2E86DE;
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.08);
      transition: all 0.15s ease;
    }

    .slot-tile.empty {
      background: white;
      border: 2px dashed #A4B0BE;
      cursor: default;
    }

    .tiles-bank {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 15px 0 20px 0;
    }

    .letter-btn {
      width: 46px;
      height: 50px;
      border-radius: 12px;
      border: none;
      background: #FF9F43;
      color: white;
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #E67E22;
      transition: all 0.15s ease;
    }

    .letter-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #E67E22;
    }

    .letter-btn.disabled {
      opacity: 0.3;
      pointer-events: none;
      box-shadow: none;
      background: #CED6E0;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .clear-btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      padding: 8px 16px;
      border-radius: 12px;
      border: 2px solid #EE5253;
      background: #FF8585;
      color: white;
      cursor: pointer;
      box-shadow: 0 3px 0 #C82333;
    }

    .clear-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #C82333;
    }

    .verb-options {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .verb-btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      padding: 10px 16px;
      border-radius: 12px;
      border: 2px solid #54A0FF;
      background: #E8F4FE;
      color: #2E86DE;
      cursor: pointer;
      transition: all 0.2s;
    }

    .verb-btn:hover, .verb-btn.selected {
      background: #2E86DE;
      color: white;
      transform: translateY(-2px);
    }

    .action-btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      padding: 12px 30px;
      border-radius: 20px;
      border: none;
      background: var(--green);
      color: white;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: all 0.2s;
    }

    .action-btn:active {
      transform: scale(0.95);
    }

    /* Progress Header */
    .progress-bar-container {
      width: 100%;
      height: 16px;
      background: #E0E0E0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--yellow), var(--green));
      transition: width 0.3s ease;
    }

    /* Module 2: Song Sentence Sequence */
    .sentence-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 15px 0;
    }

    .sentence-card {
      background: white;
      border: 2px solid #1DD1A1;
      padding: 12px 18px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
    }

    .sentence-num {
      width: 32px;
      height: 32px;
      background: var(--accent);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka One', cursive;
      flex-shrink: 0;
    }

    .sentence-text {
      flex-grow: 1;
      color: #2C3E50;
    }

    .move-btns {
      display: flex;
      gap: 6px;
    }

    .move-btn {
      background: #E8F4FE;
      border: 2px solid #54A0FF;
      color: #2E86DE;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      transition: all 0.15s;
    }

    .move-btn:active {
      background: #54A0FF;
      color: white;
    }

    .feedback-msg {
      margin-top: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      min-height: 25px;
    }

    .correct { color: #1DD1A1; }
    .wrong { color: #EE5253; }

    @media (max-width: 600px) {
      h1 { font-size: 1.4rem; }
      .teacher-speech { font-size: 0.95rem; }
      .tab-btn { font-size: 0.85rem; padding: 8px 12px; }
      .letter-btn { width: 38px; height: 42px; font-size: 1.3rem; }
      .slot-tile { width: 36px; height: 40px; font-size: 1.3rem; }
      .sentence-card { font-size: 0.9rem; padding: 10px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🏖️ Beach Adventure Game</h1>
    <p style="font-size: 0.9rem; opacity: 0.95;">With Teacher Wafi 🧕</p>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab(event, 'tab1')">🔤 1. Unscramble & Verb Match</button>
    <button class="tab-btn" onclick="switchTab(event, 'tab2')">🎵 2. Song Sequence</button>
  </div>

  <div class="container">
    <!-- Hijab Teacher Wafi Header -->
    <div class="teacher-box">
      <div class="teacher-avatar">🧕</div>
      <div class="teacher-speech" id="teacher-text">
        Hello pupils! I am Teacher Wafi. Tap the letter tiles to unjumble the word, then pick the matching verb!
      </div>
    </div>

    <!-- MODULE 1: Tile-Based Unscramble & Verb Matching -->
    <div id="tab1" class="game-screen active">
      <div class="progress-bar-container">
        <div class="progress-bar" id="word-progress"></div>
      </div>

      <div class="word-card">
        <div class="word-icon" id="item-icon">🏰</div>

        <p style="font-weight:700; color: #2E86DE;">1. Tap letter tiles to spell the word:</p>

        <!-- Answer Slots -->
        <div class="slots-container" id="slots-container"></div>

        <!-- Tile Selection Bank -->
        <div class="tiles-bank" id="tiles-bank"></div>

        <div class="btn-group">
          <button class="clear-btn" onclick="clearLetters()">🧹 Reset Letters</button>
        </div>

        <div style="margin-top: 15px;">
          <p style="margin-bottom: 8px; font-weight:700; color: #2E86DE;">2. Choose the correct action verb:</p>
          <div class="verb-options" id="verb-container"></div>
        </div>

        <div class="feedback-msg" id="word-feedback"></div>
        <button class="action-btn" onclick="checkWordAnswer()">Check Answer ✨</button>
      </div>
    </div>

    <!-- MODULE 2: Song Sentence Sequence -->
    <div id="tab2" class="game-screen">
      <p style="text-align: center; font-weight:700; margin-bottom: 12px; color:#2E86DE; font-size:1.1rem;">
        🎶 Re-arrange the song lyrics into the correct sequence!
      </p>

      <div class="sentence-list" id="sentence-container"></div>

      <div class="feedback-msg" id="song-feedback" style="text-align: center;"></div>
      <div style="text-align: center;">
        <button class="action-btn" onclick="checkSongSequence()">Check Sequence 🌟</button>
      </div>
    </div>
  </div>

  <script>
    // Target Vocabulary Data
    const wordData = [
      { target: "sandcastle", verb: "make", icon: "🏰", verbs: ["make", "look for", "catch", "eat"] },
      { target: "shells", verb: "look for", icon: "🐚", verbs: ["look for", "read", "paint", "make"] },
      { target: "fish", verb: "catch", icon: "🐟", verbs: ["catch", "take", "listen to", "eat"] },
      { target: "music", verb: "listen to", icon: "🎧", verbs: ["listen to", "make", "paint", "read"] },
      { target: "book", verb: "read", icon: "📖", verbs: ["read", "eat", "catch", "look for"] },
      { target: "photo", verb: "take", icon: "📷", verbs: ["take", "paint", "make", "listen to"] },
      { target: "picture", verb: "paint", icon: "🎨", verbs: ["paint", "read", "take", "catch"] },
      { target: "ice cream", verb: "eat", icon: "🍦", verbs: ["eat", "make", "look for", "paint"] }
    ];

    // Correct Song Sequence
    const songSentencesCorrect = [
      "Let's go to the beach.",
      "Let's look for shells.",
      "Let's play in the sand.",
      "Let's run hand in hand.",
      "Happy holiday, happy holiday for you and me.",
      "Let's take a photo.",
      "Let's catch a fish.",
      "Let's swim in the sea, 1, 2, 3! Happy holiday!"
    ];

    let currentWordIndex = 0;
    let selectedVerb = "";
    let jumbledTiles = [];
    let placedLetters = [];
    let currentSongOrder = [];

    window.onload = function() {
      loadWordQuestion();
      initSongSequence();
    };

    function switchTab(evt, tabId) {
      document.querySelectorAll('.game-screen').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      if (evt && evt.currentTarget) {
        evt.currentTarget.classList.add('active');
      }

      const teacherSpeech = document.getElementById('teacher-text');
      if(tabId === 'tab1') {
        teacherSpeech.innerText = "Teacher Wafi says: Tap the letter tiles to spell the word, then choose the verb!";
      } else if(tabId === 'tab2') {
        teacherSpeech.innerText = "Teacher Wafi says: Use the ▲ and ▼ buttons to arrange the beach song lyrics in order!";
      }
    }

    /* MODULE 1: Tile-Based Unscramble */
    function loadWordQuestion() {
      const item = wordData[currentWordIndex];
      document.getElementById('item-icon').innerText = item.icon;
      document.getElementById('word-feedback').innerText = "";
      selectedVerb = "";
      placedLetters = [];

      // Update progress
      const progressPercent = (currentWordIndex / wordData.length) * 100;
      document.getElementById('word-progress').style.width = progressPercent + "%";

      // Prepare Jumbled Tiles (ignoring spaces for "ice cream")
      const letters = item.target.replace(/\s+/g, '').split('');
      jumbledTiles = letters.map((char, id) => ({ id, char })).sort(() => Math.random() - 0.5);

      renderTilesAndSlots();

      // Populate Verb Buttons
      const verbContainer = document.getElementById('verb-container');
      verbContainer.innerHTML = "";
      item.verbs.forEach(v => {
        const btn = document.createElement('button');
        btn.className = "verb-btn";
        btn.innerText = v;
        btn.onclick = () => selectVerb(btn, v);
        verbContainer.appendChild(btn);
      });
    }

    function renderTilesAndSlots() {
      const item = wordData[currentWordIndex];
      const targetLength = item.target.replace(/\s+/g, '').length;

      // Render Slots
      const slotsContainer = document.getElementById('slots-container');
      slotsContainer.innerHTML = "";

      for (let i = 0; i < targetLength; i++) {
        const tile = document.createElement('div');
        if (placedLetters[i]) {
          tile.className = "slot-tile";
          tile.innerText = placedLetters[i].char.toUpperCase();
          tile.onclick = () => removePlacedLetter(i);
        } else {
          tile.className = "slot-tile empty";
          tile.innerText = "";
        }
        slotsContainer.appendChild(tile);
      }

      // Render Bank Tiles
      const bankContainer = document.getElementById('tiles-bank');
      bankContainer.innerHTML = "";

      jumbledTiles.forEach(tileObj => {
        const btn = document.createElement('button');
        const isUsed = placedLetters.some(p => p.id === tileObj.id);
        btn.className = "letter-btn" + (isUsed ? " disabled" : "");
        btn.innerText = tileObj.char.toUpperCase();
        btn.onclick = () => tapTile(tileObj);
        bankContainer.appendChild(btn);
      });
    }

    function tapTile(tileObj) {
      const item = wordData[currentWordIndex];
      const targetLength = item.target.replace(/\s+/g, '').length;

      if (placedLetters.length < targetLength && !placedLetters.some(p => p.id === tileObj.id)) {
        placedLetters.push(tileObj);
        renderTilesAndSlots();
      }
    }

    function removePlacedLetter(index) {
      placedLetters.splice(index, 1);
      renderTilesAndSlots();
    }

    function clearLetters() {
      placedLetters = [];
      renderTilesAndSlots();
    }

    function selectVerb(btn, verb) {
      document.querySelectorAll('.verb-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedVerb = verb;
    }

    function checkWordAnswer() {
      const currentItem = wordData[currentWordIndex];
      const targetWordClean = currentItem.target.replace(/\s+/g, '');
      const currentSpelling = placedLetters.map(p => p.char).join('');
      const feedback = document.getElementById('word-feedback');

      if (currentSpelling === targetWordClean && selectedVerb === currentItem.verb) {
        feedback.className = "feedback-msg correct";
        feedback.innerText = "🌟 Great job! That's correct!";
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });

        setTimeout(() => {
          currentWordIndex++;
          if (currentWordIndex < wordData.length) {
            load
